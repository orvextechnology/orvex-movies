
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>ORVEX MOVIES | Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial,sans-serif}
header{background:#101522;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{color:#e50935;font-size:20px;font-weight:bold}
main{max-width:750px;margin:25px auto;padding:15px}
.panel{background:#151c2a;padding:20px;border-radius:10px;margin-bottom:20px}
h2{font-size:19px;margin:0 0 18px}
h3{font-size:16px;margin:0 0 15px;color:#e50935}
input,select,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#080f1c;color:white;border:1px solid #303b50;border-radius:6px;font-size:14px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:#bbb}
button{padding:13px 18px;background:#e50935;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#333;margin-left:8px}
.message{font-size:13px;color:#bbb;line-height:1.5;margin-top:12px}
.hidden{display:none}
hr{border:0;border-top:1px solid #303b50;margin:20px 0}
.item{background:#080f1c;padding:12px;border-radius:6px;margin:10px 0;font-size:13px;line-height:1.6}
.item strong{color:white}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
<div class="logo">ORVEX MOVIES</div>
<div>ADMIN PANEL</div>
</header>
<main>
<section class="panel" id="loginPanel">
<h2>Administrator Login</h2>
<label>Email address</label>
<input type="email" id="email" placeholder="Admin email">
<label>Password</label>
<input type="password" id="password" placeholder="Admin password">
<button id="loginButton" onclick="login()">Login</button>
<p class="message" id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="panel">
<h2>Welcome, Administrator</h2>
<p class="message">Manage movies, TV series and episodes here.</p>
<button onclick="logout()" class="secondary">Logout</button>
</div>

<div class="panel">
<h3>Add Movie or TV Series</h3>
<label>Content type</label>
<select id="contentType" onchange="updateForm()">
<option value="movie">Movie</option>
<option value="series">TV Series</option>
</select>
<label>Title</label>
<input id="title" placeholder="Enter movie or series title">
<label>Description</label>
<textarea id="description" placeholder="Write a short description"></textarea>
<label>Poster image URL (optional for drafts)</label>
<input id="poster" type="url" placeholder="https://example.com/poster.jpg">
<label>Backdrop image URL (optional)</label>
<input id="backdrop" type="url" placeholder="https://example.com/backdrop.jpg">
<label>Release year</label>
<input id="year" type="number" placeholder="2026">
<div id="movieFields">
<label>Authorized direct video URL (optional for drafts)</label>
<input id="video" type="url" placeholder="https://example.com/movie.mp4">
<p class="small">Only use video links you own or have permission to stream.</p>
</div>
<label>Publishing status</label>
<select id="status">
<option value="draft">Save as draft</option>
<option value="published">Publish for viewers</option>
</select>
<button id="saveButton" onclick="saveTitle()">Save Content</button>
<p class="message" id="saveMessage"></p>
</div>

<div class="panel" id="episodePanel">
<h3>Add Episode to a Series</h3>
<label>Select series</label>
<select id="seriesSelect"><option value="">Loading series...</option></select>
<label>Season number</label>
<input type="number" id="season" min="1" placeholder="1">
<label>Episode number</label>
<input type="number" id="episode" min="1" placeholder="1">
<label>Episode title</label>
<input id="episodeTitle" placeholder="Episode title">
<label>Episode description</label>
<textarea id="episodeDescription" placeholder="Episode description"></textarea>
<label>Authorized episode video URL</label>
<input type="url" id="episodeVideo" placeholder="https://example.com/episode.mp4">
<button id="episodeButton" onclick="saveEpisode()">Save Episode</button>
<p class="message" id="episodeMessage"></p>
</div>

<div class="panel">
<h3>Your Content</h3>
<button onclick="loadAdminTitles()">Refresh Content</button>
<div id="contentList" class="message">Loading...</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://dfoxaomvdsrylreiqaum.supabase.co";
const SUPABASE_KEY="sb_publishable_oMRvFbAXw15r_RlBw_jSxQ_Z1QVEP4d";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;

function message(id,text){
 document.getElementById(id).textContent=text;
}

function validURL(value){
 if(!value)return true;
 try{
  const url=new URL(value);
  return url.protocol==="https:"||url.protocol==="http:";
 }catch{return false;}
}

function updateForm(){
 const type=document.getElementById("contentType").value;
 document.getElementById("movieFields").classList.toggle("hidden",type==="series");
 document.getElementById("episodePanel").classList.toggle("hidden",type==="movie");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const button=document.getElementById("loginButton");

 if(!email||!password){
  message("loginMessage","Enter your email and password.");
  return;
 }

 button.disabled=true;
 message("loginMessage","Checking login...");

 try{
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;

  currentUser=data.user;

  const {data:roleData,error:roleError}=await db
   .from("user_roles").select("role")
   .eq("user_id",currentUser.id).single();

  if(roleError||roleData.role!=="admin"){
   await db.auth.signOut();
   currentUser=null;
   throw new Error("This account does not have administrator access.");
  }

  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  await loadAdminTitles();

 }catch(error){
  message("loginMessage",error.message);
 }finally{
  button.disabled=false;
 }
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("loginPanel").classList.remove("hidden");
 message("loginMessage","You have logged out.");
}

async function saveTitle(){
 const type=document.getElementById("contentType").value;
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();
 const poster=document.getElementById("poster").value.trim();
 const backdrop=document.getElementById("backdrop").value.trim();
 const yearValue=document.getElementById("year").value;
 const status=document.getElementById("status").value;
 const video=document.getElementById("video").value.trim();
 const button=document.getElementById("saveButton");

 if(!title){
  message("saveMessage","Please enter a title.");
  return;
 }

 if(!validURL(poster)||!validURL(backdrop)||!validURL(video)){
  message("saveMessage","Check your image and video URLs.");
  return;
 }

 if(status==="published"){
  if(!poster){
   message("saveMessage","Add a poster before publishing.");
   return;
  }
  if(type==="movie"&&!video){
   message("saveMessage","Add an authorized video URL before publishing a movie.");
   return;
  }
 }

 button.disabled=true;
 message("saveMessage","Saving content...");

 try{
  const record={
   title:title,
   content_type:type,
   description:description,
   poster_url:poster||null,
   backdrop_url:backdrop||null,
   release_year:yearValue?Number(yearValue):null,
   status:status,
   video_url:type==="movie"?(video||null):null
  };

  const {error}=await db.from("titles").insert(record);
  if(error)throw error;

  message("saveMessage","Success! Content saved.");

  document.getElementById("title").value="";
  document.getElementById("description").value="";
  document.getElementById("poster").value="";
  document.getElementById("backdrop").value="";
  document.getElementById("year").value="";
  document.getElementById("video").value="";

  await loadAdminTitles();

 }catch(error){
  message("saveMessage","Error: "+error.message);
 }finally{
  button.disabled=false;
 }
}

async function saveEpisode(){
 const seriesId=document.getElementById("seriesSelect").value;
 const season=Number(document.getElementById("season").value);
 const episode=Number(document.getElementById("episode").value);
 const title=document.getElementById("episodeTitle").value.trim();
 const description=document.getElementById("episodeDescription").value.trim();
 const video=document.getElementById("episodeVideo").value.trim();
 const button=document.getElementById("episodeButton");

 if(!seriesId||!season||!episode||!title||!video){
  message("episodeMessage","Complete all episode fields.");
  return;
 }

 if(!validURL(video)){
  message("episodeMessage","Enter a valid video URL.");
  return;
 }

 button.disabled=true;
 message("episodeMessage","Saving episode...");

 try{
  const {error}=await db.from("episodes").insert({
   series_id:seriesId,
   season_number:season,
   episode_number:episode,
   title:title,
   description:description,
   video_url:video
  });

  if(error)throw error;

  message("episodeMessage","Episode saved successfully.");
  document.getElementById("season").value="";
  document.getElementById("episode").value="";
  document.getElementById("episodeTitle").value="";
  document.getElementById("episodeDescription").value="";
  document.getElementById("episodeVideo").value="";

 }catch(error){
  message("episodeMessage","Error: "+error.message);
 }finally{
  button.disabled=false;
 }
}

async function loadAdminTitles(){
 const list=document.getElementById("contentList");
 const select=document.getElementById("seriesSelect");
 list.textContent="Loading content...";
 select.innerHTML='<option value="">Loading series...</option>';

 try{
  const {data,error}=await db.from("titles")
   .select("id,title,content_type,status")
   .order("created_at",{ascending:false});

  if(error)throw error;

  const series=(data||[]).filter(item=>item.content_type==="series");
  select.innerHTML='<option value="">Choose a series</option>';

  series.forEach(item=>{
   const option=document.createElement("option");
   option.value=item.id;
   option.textContent=item.title;
   select.appendChild(option);
  });

  list.innerHTML="";

  if(!data||!data.length){
   list.textContent="No content added yet.";
   return;
  }

  data.forEach(item=>{
   const div=document.createElement("div");
   div.className="item";
   const name=document.createElement("strong");
   name.textContent=item.title;
   const details=document.createElement("div");
   details.textContent=item.content_type+" • "+item.status;
   div.appendChild(name);
   div.appendChild(details);
   list.appendChild(div);
  });

 }catch(error){
  list.textContent="Unable to load content: "+error.message;
  select.innerHTML='<option value="">Could not load series</option>';
 }
}

async function checkExistingSession(){
 const {data}=await db.auth.getSession();
 if(!data.session)return;

 currentUser=data.session.user;
 const {data:roleData,error}=await db.from("user_roles")
  .select("role").eq("user_id",currentUser.id).single();

 if(!error&&roleData&&roleData.role==="admin"){
  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  await loadAdminTitles();
 }else{
  await db.auth.signOut();
 }
}

updateForm();
checkExistingSession();
</script>
</body>
</html>
